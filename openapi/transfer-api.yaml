openapi: 3.0.3

info:
  title: ShadowBank Transfer API
  version: 0.1.0
  description: API for creating and managing money transfers.

paths:
  /transfers:
    post:
      description: Create a money transfer

      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key used to prevent duplicate transfer processing
          schema:
            type: string
            pattern: '^[a-zA-Z0-9-]{1,50}$'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object

              required:
                - sourceAccountId
                - destinationAccountId
                - amount
                - currency

              properties:
                sourceAccountId:
                  type: string
                  description: The account ID to transfer money from
                  pattern: '^[0-9]{1,20}$'

                destinationAccountId:
                  type: string
                  description: The account ID to transfer money to
                  pattern: '^[0-9]{1,20}$'

                amount:
                  type: number
                  format: double
                  description: The amount to transfer
                  minimum: 0.01

                currency:
                  type: string
                  description: The currency of the transfer
                  pattern: '^[A-Z]{3}$'

      responses:
        '201':
          description: Transfer created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  transferId:
                    type: string
                    example: TRF-100001
                  status:
                    type: string
                    example: PENDING

        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '422':
          description: Business validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object

      required:
        - code
        - message
        - correlationId

      properties:
        code:
          type: string
          example: ACCOUNT_NOT_FOUND

        message:
          type: string
          example: The source account does not exist.

        correlationId:
          type: string
          example: CORR-8f92a1